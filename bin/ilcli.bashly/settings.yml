# bashly settings for bin/ilcli. Regenerate from the repository root with: npm run generate:cli
source_dir: bin/ilcli.bashly
target_dir: bin
lib_dir: lib
env: production
strict: true
# Arguments for claude pass through unsplit: -abc stays -abc, --model=x stays --model=x.
compact_short_flags: false
conjoined_flag_args: false
