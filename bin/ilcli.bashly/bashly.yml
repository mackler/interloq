name: ilcli
help: |-
  Interloq's development container, and the route of a change to the installed copy.

  The docker commands (run, shell, web, build, down) and release run on the host in the development clone; upgrade runs on the host in the installed copy (~/work/interloq). The script uses compose.cc.yaml in the root of the clone that contains it, and that file mounts the same clone at /workspace.

  run, shell and web create the container only when none exists and never recreate a running one, so none of them stops a program another started. The container keeps the configuration it was created with, the credential variables of the shell that created it included; when compose.cc.yaml, or the variables of the shell in use, resolve differently, these commands say so on stderr and start in the container as it is. bin/ilcli down, then a start, applies the new configuration, and down stops Claude Code and the web server running in the container.

  Any first argument that is not a command, --version and -v included, is passed to claude, so run can be left out. After any command, --help and -h show that command's usage; -- passes the rest on to the program the command starts (bin/ilcli run -- --help).

  The route of a change: commit on main, bin/ilcli release (pushes main), CI runs npm test and the end-to-end tests on GitHub and advances the release branch only if both pass, then bin/ilcli upgrade in the installed copy. The installed copy follows release, so it can only ever install a commit whose tests passed.
version: "1"

commands:
- name: run
  default: force
  help: |-
    Start the container if needed, then start Claude Code in it

    An existing container is never recreated; if its configuration is older than compose.cc.yaml gives in this shell, a note on stderr says so and that bin/ilcli down, then a start, applies it.

    --help and -h show this usage; -- passes the rest on to claude unchanged, so bin/ilcli run -- --help is Claude Code's own help.

    -c, --continue   continue the most recent session (passed to claude, not read by ilcli)
  catch_all:
    label: claude arguments
    help: Passed to claude unchanged, -- included
  examples:
  - bin/ilcli                  new session
  - bin/ilcli --continue       most recent session
  - bin/ilcli run -c           most recent session
  - bin/ilcli run --resume     session list
  - bin/ilcli run -- --help    Claude Code's own help
  - bin/ilcli run --help       this usage

- name: shell
  help: |-
    Start the container if needed, then open a Bash shell in it

    An existing container is never recreated; if its configuration is older than compose.cc.yaml gives in this shell, a note on stderr says so and that bin/ilcli down, then a start, applies it.
  catch_all:
    label: ignored
    help: Accepted and ignored; --help and -h show this usage

- name: web
  help: |-
    Start the container if needed, then start Interloq's web server in it, in the foreground; Ctrl+C ends it

    The port defaults to 8090, the one compose.cc.yaml publishes (8090:8090), at http://localhost:8090/. A server on another port is not reachable from the host until that ports line is changed and the container is recreated (bin/ilcli down, then bin/ilcli web), not restarted: an existing container is never recreated by run, shell or web, which instead say on stderr that its configuration is older than compose.cc.yaml gives in this shell. The server refuses to start until the page is built: npm run build in the installed copy, which bin/ilcli upgrade does. --help and -h show this usage.
  catch_all:
    label: port
    help: 'Passed to node /opt/interloq/src/web.ts unchanged: [port]'
  examples:
  - bin/ilcli web           port 8090
  - bin/ilcli web 8091      port 8091, reachable from the host only after compose.cc.yaml is changed and the container recreated

- name: build
  help: Build the image from ../claude-code-image
  catch_all:
    label: ignored
    help: Accepted and ignored; --help and -h show this usage

- name: down
  help: |-
    Stop and remove the container (the volumes are kept)

    This stops Claude Code and the web server running in it. The next run, shell or web creates the container again from compose.cc.yaml and the credential variables of the shell it is started from.
  catch_all:
    label: ignored
    help: Accepted and ignored; --help and -h show this usage

- name: release
  help: |-
    Push main to GitHub, where CI runs npm test and the end-to-end tests and advances release only if both pass

    Run on the host in the development clone, on main, with a clean working tree that is not behind origin/main. Nothing is pushed if a check fails.

- name: upgrade
  help: |-
    Bring the installed copy to origin/release, then npm ci and npm run build

    Run on the host in the installed copy: on branch release tracking origin/release, with no local changes and no commits that origin/release lacks. Nothing is changed if a check fails. npm ci and npm run build run every time, so running it again repeats a failed install or build. Afterwards restart the web server and reload the open tabs.

    Before changing anything, upgrade reads the mounts of every running container (docker ps, then docker inspect) and searches only the containers that mount the installed copy or a part of it, at whatever path they mount it (docker exec ... pgrep), for a process whose command line names the copy there: the web server, the Claude Code and Codex binaries, or anything else. A container that does not mount the copy cannot run it and is not searched, so one without pgrep, such as a database image, does not stop the upgrade. A docker launcher on the host does not count. It refuses if it finds one, naming the containers and the command lines. Replacing those files can kill a running agent at any later point until its run ends, not only during the update; a run waiting for an answer still has its web server running, so it is found too.

    It also refuses when it cannot make the check: docker missing, docker ps failing, a container whose mounts cannot be read, or a container that mounts the copy where the search fails, for example one without pgrep, which the refusal names. --force skips the check. A run started outside a container is not detected.
  flags:
  - long: --force
    help: Skip the check for processes using the installed copy
  examples:
  - bin/ilcli upgrade           refuses while a container that mounts the installed copy runs anything from it
  - bin/ilcli upgrade --force   skips that check

- name: help
  help: Show this text, or the usage of one command
  args:
  - name: command
    help: The command whose usage to show
    allowed: [run, shell, web, build, down, release, upgrade, help]
