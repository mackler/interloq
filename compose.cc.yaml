# compose.cc.yaml — Claude Code container for developing Interloq.
# Use it from the development clone only; the mount below is the current directory.
# The container also carries the Codex credentials and the installed program at
# /opt/interloq, so that the installed orchestrator can be run against this clone.
# This container has no firewall: Claude Code and Codex in it reach every host.
name: interloq-dev

services:
  cc:
    container_name: interloq-claude
    build:
      context: ./container
    image: claude-code-base
    user: node
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - claude-config:/home/node/.claude
      - codex-config:/home/node/.codex
      - ${HOME}/work/interloq:/opt/interloq:ro
    environment:
      - CLAUDE_CODE_OAUTH_TOKEN
      # Optional, passed through from the host: a fine-grained GitHub token limited to this repository
      # with Issues read and write, so that the assistant in this container can file an issue directly.
      # Nothing in the program reads it. Absent, the variable is simply empty.
      - INTERLOQ_ISSUES_TOKEN
      # The program's own tracker credential (issue #120): a fine-grained GitHub token limited to the
      # project's repository with Issues read and write, which src/trackerLive.ts reads and passes to the
      # adapter. Separate from INTERLOQ_ISSUES_TOKEN above, which is the assistant's and is scoped
      # differently. A new entry here takes effect when the container is recreated.
      - INTERLOQ_GITHUB_TOKEN
    # The web GUI (node /opt/interloq/src/web.ts, default port 8090), reached from the host's browser at
    # http://localhost:8090/ without a token or login. A new ports line takes effect when the container is recreated.
    ports:
      - "8090:8090"
    # Keeps the container running between sessions; the image's own CMD would start
    # claude without a terminal, which exits at once.
    command: sleep infinity
    # An init process as PID 1, so that orphaned children are reaped. Without it, `sleep` is PID 1
    # and every helper that git leaves behind stays as a zombie (thousands after a day of test runs).
    init: true

volumes:
  # Created under the compose project's former name, plan-review-dev, and named explicitly here so that
  # renaming the project to interloq-dev keeps the Claude Code login instead of making an empty volume.
  claude-config:
    external: true
    name: plan-review-dev_claude-config
  codex-config:
    external: true
    name: iou-notes-codex_codex-config
